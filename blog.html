---
layout: default
title: Blog
permalink: /blog/
---
<section class="section">
  <h2>Blog</h2>
  <ul class="post-list">
    {% for post in site.posts %}
    <li class="post-list-item">
      <a href="{{ post.url | relative_url }}">
        <span class="post-list-date">{{ post.date | date: "%d.%m.%Y" }}</span>
        <span class="post-list-title">{{ post.title }}</span>{% if post.genre %}<span class="post-list-date"> · {{ post.genre }}</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
