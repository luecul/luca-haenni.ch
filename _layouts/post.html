---
layout: default
---
<article class="section post">
  <p class="post-meta">{{ page.date | date: "%d.%m.%Y" }}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Zurück zum Blog</a></p>
</article>
